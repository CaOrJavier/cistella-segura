<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz de Bolets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root {
  --bg: #f6f2e7; --glow: #ffdcbf; --card: #ffffff; --card-2: #f2ece0; --line: #e2d9c5; --ink: #1c2a21; --muted: #5f6d64;
  --accent: #f2621f; --accent-2: #e23c4b; --accent-ink: #fff; --gold: #e3a000; --green: #3d9a2a;
  --ok: #1e9e57; --ok-bg: #dcf5e6; --ko: #e23c3c; --ko-bg: #fde2e2;
  --warn: #b06c00; --warn-bg: #fff0d1; --care: #5258c4; --care-bg: #e7e8fb; --deadly: #c62828; --deadly-bg: #fde0e0;
  --shadow: 0 1px 2px rgb(40 30 10 / .06), 0 8px 24px rgb(40 30 10 / .08);
  --display: "Fredoka", "Nunito", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 16px; --ease: cubic-bezier(.2, .8, .2, 1); --spring: cubic-bezier(.2, 1.5, .4, 1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1611; --glow: #1d3a28; --card: #16231b; --card-2: #1f3125; --line: #2c4333; --ink: #eef5ec; --muted: #97ad9d;
    --accent: #ff7a3d; --accent-2: #ff4f5e; --accent-ink: #1b0a03; --gold: #ffcb47; --green: #74de5f;
    --ok: #3fd47a; --ok-bg: #12331f; --ko: #ff6262; --ko-bg: #3a1618;
    --warn: #ffb547; --warn-bg: #3a2a10; --care: #a9adff; --care-bg: #262947; --deadly: #ff6b6b; --deadly-bg: #3f1a1a;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 10px 28px rgb(0 0 0 / .3);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
body { margin: 0; min-height: 100vh; color: var(--ink); font: 16px/1.5 var(--body);
  background: radial-gradient(900px 520px at 50% -120px, var(--glow), transparent 70%) no-repeat, var(--bg); }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); }
.es { font-weight: 400; color: var(--muted); font-size: .82em; font-family: var(--body); }
.badge { display: inline-block; border-radius: 99px; padding: 1px 10px; font-size: .8rem; font-weight: 800; }
.b-comestible { background: var(--ok-bg); color: var(--ok); } .b-precaucio { background: var(--care-bg); color: var(--care); }
.b-toxic { background: var(--warn-bg); color: var(--warn); } .b-mortal { background: var(--deadly-bg); color: var(--deadly); }
/* botó amb volum: s'enfonsa en prémer-lo */
.btn3d { border: 0; border-radius: var(--r); font: 600 1.2rem var(--display); padding: 14px 18px; transition: transform .1s, box-shadow .1s, filter .2s; }
.btn3d:active { transform: translateY(4px); }
.btn-go { background: var(--accent); color: var(--accent-ink); box-shadow: 0 5px 0 color-mix(in srgb, var(--accent) 55%, #000); }
.btn-go:active { box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 55%, #000); }
.btn-go:hover { filter: brightness(1.06); }
.btn-soft { background: var(--card); color: var(--ink); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); }
.btn-soft:active { box-shadow: 0 0 0 var(--line); }

/* ---------- pantalla de càrrega ---------- */
#splash { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; overflow: hidden; color: #f4efe6; cursor: pointer;
  background: radial-gradient(120% 80% at 50% 100%, #2f4a2c 0%, #16241a 45%, #0b120d 100%); }
#splash.out { animation: splashOut .7s cubic-bezier(.7, 0, .3, 1) forwards; pointer-events: none; }
@keyframes splashOut { to { opacity: 0; transform: scale(1.12); filter: blur(6px); } }
.sp-box { position: relative; z-index: 1; text-align: center; padding: 0 16px; }
.sp-shroom { display: block; width: min(200px, 50vw); height: min(200px, 50vw); margin: 0 auto; overflow: visible; }
.sp-stem { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .8s cubic-bezier(.3, 1.5, .5, 1) .15s backwards; }
.sp-cap { transform-box: fill-box; transform-origin: 50% 100%; animation: capPop .7s cubic-bezier(.3, 1.7, .5, 1) .75s backwards, wiggle 2.6s ease-in-out 2s infinite; }
.sp-dot { transform-box: fill-box; transform-origin: center; animation: dotPop .4s cubic-bezier(.3, 1.8, .5, 1) backwards; }
.sp-eye { transform-box: fill-box; transform-origin: center; animation: fade .3s 1.4s backwards, blink 3.2s 2.4s infinite; }
.sp-smile { animation: fade .3s 1.5s backwards; }
@keyframes grow { from { transform: scaleY(0); } }
@keyframes capPop { from { transform: scale(0) rotate(-25deg); } }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
@keyframes dotPop { from { transform: scale(0); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
.sp-ground { width: 0; height: 3px; margin: -6px auto 0; border-radius: 3px; background: linear-gradient(90deg, transparent, #9cc07f, transparent); animation: ground .8s ease-out .1s forwards; }
@keyframes ground { to { width: 230px; } }
.sp-title { font: 700 clamp(2.4rem, 10vw, 3.6rem)/1 var(--display); margin: 24px 0 8px; white-space: nowrap; }
.sp-title span { display: inline-block; animation: letterIn .6s var(--spring) backwards; }
@keyframes letterIn { from { opacity: 0; transform: translateY(34px) rotate(10deg) scale(.5); } }
.sp-tip { min-height: 1.5em; margin: 0 0 14px; color: #b9c7b4; font-size: .95rem; }
.sp-tip.sw { animation: tipIn .35s ease-out; }
@keyframes tipIn { from { opacity: 0; transform: translateY(6px); } }
.sp-bar { width: min(240px, 70vw); height: 6px; margin: 0 auto; border-radius: 99px; background: rgb(255 255 255 / .12); overflow: hidden; }
.sp-bar i { display: block; width: 0; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #9cc07f, #ff7a3d); transition: width .25s linear; }
.sp-skip { position: absolute; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom)); text-align: center; font-size: .8rem; color: rgb(255 255 255 / .4); animation: fade 1s 1.6s backwards; }
.spore { position: absolute; bottom: -12px; border-radius: 50%; background: rgb(243 233 200 / .55); box-shadow: 0 0 8px rgb(243 233 200 / .5); animation: spore linear infinite; }
@keyframes spore { 0% { transform: translate(0, 0); opacity: 0; } 12% { opacity: 1; } 100% { transform: translate(var(--dx), -110vh); opacity: 0; } }

/* ---------- cortina d'inici ---------- */
.intro { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; overflow: hidden; color: #fff;
  background: radial-gradient(circle at var(--x) var(--y), #ff9a5c, #f2621f 40%, #8a1f24 100%);
  clip-path: circle(0 at var(--x) var(--y)); animation: introIn .6s cubic-bezier(.7, 0, .25, 1) forwards; }
@keyframes introIn { to { clip-path: circle(150vmax at var(--x) var(--y)); } }
.intro.out { clip-path: circle(150vmax at var(--x) var(--y)); animation: introOut .6s cubic-bezier(.7, 0, .3, 1) forwards; }
@keyframes introOut { to { transform: translateY(-105%); } }
.in-rays { position: absolute; inset: -50%; background: repeating-conic-gradient(from 0deg, rgb(255 255 255 / .1) 0 9deg, transparent 9deg 18deg); animation: spin 14s linear infinite; }
@keyframes spin { to { transform: rotate(1turn); } }
.in-box { position: relative; text-align: center; padding: 0 20px; }
.in-sub { margin: 0; font: 600 .85rem var(--display); letter-spacing: .14em; text-transform: uppercase; opacity: .9; animation: rise .5s .25s backwards; }
.in-title { font: 700 clamp(2.4rem, 11vw, 4.4rem)/1.05 var(--display); margin: 8px 0 18px; text-shadow: 0 4px 24px rgb(0 0 0 / .3); animation: titleIn .7s var(--spring) .3s backwards; }
@keyframes titleIn { from { opacity: 0; transform: scale(.4) rotate(-6deg); } }
.in-count { height: 8rem; display: grid; place-items: center; }
.in-count span { font: 700 7rem/1 var(--display); text-shadow: 0 6px 30px rgb(0 0 0 / .35); animation: countIn .56s var(--spring) both; }
.in-count span.go { font-size: 4.4rem; color: #fff3c4; animation: goIn .7s var(--spring) both; }
@keyframes countIn { 0% { opacity: 0; transform: scale(2.6); } 60% { opacity: 1; transform: scale(.92); } 100% { opacity: 1; transform: none; } }
@keyframes goIn { 0% { opacity: 0; transform: scale(.2) rotate(-12deg); } 70% { transform: scale(1.12) rotate(3deg); } 100% { opacity: 1; transform: none; } }
.in-skip { position: absolute; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom)); text-align: center; font-size: .8rem; opacity: .6; }

/* ---------- inici ---------- */
.top { display: flex; align-items: center; gap: 12px; padding: 8px 0 4px; }
.top .shroom { width: 52px; height: 52px; flex: none; transform-origin: 50% 90%; animation: bob 3.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px) rotate(4deg); } }
.top h1 { font-size: clamp(1.9rem, 8vw, 2.5rem); flex: 1; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
.pill { display: inline-flex; align-items: center; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 3px 11px; font-size: .85rem; font-weight: 700; }
.pill b { color: var(--accent); }
.mastery { margin: 12px 0 0; padding: 12px 14px; border-radius: var(--r); background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
.mastery .row { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; margin-bottom: 6px; }
.mastery .row span { font: 600 1.15rem var(--display); color: var(--green); }
.mbar { height: 10px; border-radius: 99px; background: var(--card-2); overflow: hidden; }
.mbar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--green), var(--gold), var(--accent)); animation: barIn 1.1s var(--ease) .3s backwards; }
@keyframes barIn { from { width: 0; } }
.warn { margin: 10px 0 0; font-size: .85rem; color: var(--warn); font-weight: 700; }
.h-sec { font: 600 .8rem var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 340px) { .modes { grid-template-columns: 1fr; } }
.mode { position: relative; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: var(--r); padding: 12px; box-shadow: 0 4px 0 var(--line); display: grid; gap: 2px; align-content: start; transition: transform .12s, box-shadow .12s, border-color .2s; }
.mode:active { transform: translateY(4px); box-shadow: 0 0 0 var(--line); }
.mode .ico { font-size: 1.8rem; line-height: 1; margin-bottom: 4px; }
.mode b { font: 600 1.1rem/1.15 var(--display); }
.mode span { color: var(--muted); font-size: .85rem; line-height: 1.3; }
.mode em { font-style: normal; font-size: .75rem; font-weight: 800; color: var(--accent); margin-top: 4px; }
.mode[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 4px 0 var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--card)); }
.mode[aria-pressed="true"]::after { content: "✓"; position: absolute; top: 8px; right: 10px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font: 700 .8rem/22px var(--body); text-align: center; animation: pop .3s var(--spring); }
.panel { margin-top: 14px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); display: grid; gap: 14px; }
.set > p { margin: 0 0 6px; font: 600 .95rem var(--display); }
.set > small { display: block; margin-top: 5px; color: var(--muted); font-size: .8rem; }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--card-2); }
.seg button { flex: 1; min-width: 0; border: 0; background: transparent; border-radius: 10px; padding: 8px 4px; font-weight: 800; font-size: .9rem; color: var(--muted); transition: background .2s, color .2s, transform .1s; }
.seg button small { display: block; font-weight: 600; font-size: .72rem; opacity: .85; }
.seg button:active { transform: scale(.95); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--accent); box-shadow: 0 2px 6px rgb(0 0 0 / .12); }
.play { width: 100%; margin-top: 16px; font-size: 1.45rem; padding: 16px; animation: glowPulse 2.4s ease-in-out infinite; }
.play small { display: block; font: 700 .8rem var(--body); opacity: .85; }
@keyframes glowPulse { 50% { filter: brightness(1.08) drop-shadow(0 0 12px color-mix(in srgb, var(--accent) 50%, transparent)); } }
.guia-card { display: flex; align-items: center; gap: 12px; margin: 18px 0 0; padding: 12px 14px; border-radius: 16px; background: var(--card, #fff); color: inherit; text-decoration: none; box-shadow: 0 2px 0 rgba(0,0,0,.08); border: 1px solid var(--line); }
.guia-card .ico { font-size: 1.6rem; }
.guia-card span:nth-child(2) { flex: 1; display: flex; flex-direction: column; }
.guia-card small { color: var(--muted); font-size: .8rem; }
.guia-link { margin: 12px 0 4px; }
.guia-link a { font-weight: 600; }
.guia-link small { display: block; font-weight: 400; color: var(--muted); }
.foot { color: var(--muted); font-size: .75rem; margin-top: 18px; text-align: center; }

/* ---------- pregunta ---------- */
.hud { display: flex; align-items: center; gap: 8px; position: sticky; top: 0; z-index: 5; padding: 10px 0; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); }
.ibtn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); padding: 0; font-size: 1rem; line-height: 1; display: grid; place-items: center; transition: transform .1s; }
.ibtn:active { transform: scale(.9); }
.ibtn.off { opacity: .55; }
.bar { flex: 1; height: 14px; border-radius: 99px; background: var(--card-2); overflow: hidden; position: relative; }
.bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--green), color-mix(in srgb, var(--green) 60%, var(--gold))); transition: width .6s var(--spring); position: relative; }
.bar i::after { content: ""; position: absolute; left: 8px; right: 8px; top: 3px; height: 3px; border-radius: 99px; background: rgb(255 255 255 / .35); }
.cnt { font: 600 .9rem var(--display); color: var(--muted); font-variant-numeric: tabular-nums; }
.sc { display: inline-flex; gap: 4px; }
.score-p { display: inline-flex; align-items: center; gap: 3px; padding: 4px 10px; border-radius: 99px; background: color-mix(in srgb, var(--gold) 18%, var(--card)); color: var(--gold); font: 700 .95rem var(--display); font-variant-numeric: tabular-nums; }
.streak-p { display: inline-flex; align-items: center; gap: 2px; padding: 4px 9px; border-radius: 99px; background: color-mix(in srgb, var(--accent) 18%, var(--card)); color: var(--accent); font: 700 .95rem var(--display); }
.bump { animation: bump .45s ease-out; }
.fin { border: 2px solid var(--line); background: var(--card); border-radius: 99px; padding: 4px 12px; font-weight: 800; font-size: .85rem; }
.qtag { display: inline-block; background: var(--card-2); border-radius: 99px; padding: 2px 12px; font: 600 .75rem var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.qtag.hard { background: var(--deadly-bg); color: var(--deadly); }
.prompt { font-size: 1.45rem; margin: 6px 0 12px; }
.photo { margin: 0 0 12px; position: relative; border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow);
  background: linear-gradient(100deg, #101712 30%, #1e2a22 50%, #101712 70%) 0 0 / 200% 100%; animation: shimmer 1.4s linear infinite; }
.photo:has(img.ld) { animation: none; background: #0e130f; }
.photo img { display: block; width: 100%; height: min(42vh, 440px); object-fit: contain; cursor: zoom-in; }
.photo .tag { position: absolute; left: 10px; top: 10px; background: rgb(0 0 0 / .55); color: #fff; font-size: .75rem; font-weight: 700; padding: 2px 10px; border-radius: 99px; }
.photo .zoomhint { position: absolute; right: 10px; bottom: 10px; background: rgb(0 0 0 / .5); color: #fff; border-radius: 99px; width: 30px; height: 30px; display: grid; place-items: center; font-size: .85rem; pointer-events: none; }
.photo img, .cell img { opacity: 0; transform: scale(1.06); transition: opacity .5s ease, transform .8s var(--ease); }
.photo img.ld, .cell img.ld { opacity: 1; transform: none; }
.photo.shake { animation: shake .45s; }
.dlist { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin: 0 0 12px; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; }
.dlist dt { font: 600 .9rem var(--display); color: var(--green); }
.dlist dd { margin: 0; font-size: .95rem; }
/* pistes en pestanyes */
.hint-slot:empty { display: none; }
.hint-slot { margin: 0 0 12px; }
.htabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 6px; }
.htabs::-webkit-scrollbar { display: none; }
.htab { flex: none; border: 2px solid var(--line); background: var(--card); border-radius: 99px; padding: 5px 12px; font-weight: 800; font-size: .85rem; transition: transform .1s, background .2s, border-color .2s; }
.htab:active { transform: scale(.94); }
.htab.on { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
.htab.lock { border-style: dashed; color: var(--muted); }
.htab small { font-weight: 700; color: var(--accent); }
.hbox { background: var(--warn-bg); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: .95rem; animation: rise .3s var(--ease); }
.hbox b { color: var(--warn); }
.hbox.photo-h { padding: 0; background: none; }
/* opcions */
.opts { display: grid; gap: 10px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opt { position: relative; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: var(--r); padding: 12px 12px 12px 48px; min-height: 58px; font-weight: 800; font-size: 1rem; line-height: 1.25; box-shadow: 0 4px 0 var(--line); transition: transform .1s, box-shadow .1s, background .2s, border-color .2s, opacity .3s; }
.opt .k { position: absolute; left: 10px; top: 50%; translate: 0 -50%; width: 28px; height: 28px; border-radius: 9px; background: var(--card-2); display: grid; place-items: center; font: 700 .85rem var(--display); color: var(--muted); }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--line); }
.opt:disabled { cursor: default; }
.opt.right { background: var(--ok); border-color: var(--ok); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--ok) 60%, #000); }
.opt.right .k, .opt.wrong .k { background: rgb(255 255 255 / .25); color: #fff; }
.opt.right .es, .opt.wrong .es { color: rgb(255 255 255 / .8); }
.opt.wrong { background: var(--ko); border-color: var(--ko); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--ko) 60%, #000); }
.opt.dim { opacity: .45; }
.type { display: flex; gap: 8px; }
.type input { flex: 1; min-width: 0; font: inherit; font-size: 1.1rem; font-weight: 700; padding: 14px; border: 2px solid var(--line); border-radius: var(--r); background: var(--card); color: var(--ink); }
.type input:focus { border-color: var(--accent); outline: none; }
.type .btn3d { font-size: 1.05rem; }
.type.shake { animation: shake .45s; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cell { padding: 0; border: 4px solid var(--card); border-radius: var(--r); overflow: hidden; background: #0e130f; position: relative; aspect-ratio: 1; box-shadow: 0 4px 0 var(--line); transition: transform .1s, box-shadow .1s, border-color .2s, opacity .3s; }
@media (min-width: 600px) { .cell { aspect-ratio: 4 / 3; } }
.cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cell:hover:not(:disabled) { border-color: var(--accent); }
.cell:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
.cell.right { border-color: var(--ok); box-shadow: 0 4px 0 color-mix(in srgb, var(--ok) 60%, #000); }
.cell.wrong { border-color: var(--ko); }
.cell.dim { opacity: .5; }
.cell .lab { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(transparent, rgb(0 0 0 / .85)); color: #fff; padding: 18px 8px 6px; font-size: .82rem; font-weight: 800; text-align: left; line-height: 1.2; animation: rise .35s var(--ease) backwards; }
.cell .lab .es { color: rgb(255 255 255 / .7); }
.actions { margin-top: 12px; }
.actions .btn-soft { width: 100%; font-size: 1rem; padding: 11px; color: var(--muted); }

/* ---------- resposta (panell inferior) ---------- */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; animation: sheetUp .45s var(--spring) backwards; }
@keyframes sheetUp { from { transform: translateY(105%); } }
.sh-in { max-width: 640px; margin: 0 auto; max-height: 82vh; overflow-y: auto; overscroll-behavior: contain;
  padding: 16px max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  border-radius: 22px 22px 0 0; border: 2px solid; border-bottom: 0; box-shadow: 0 -10px 40px rgb(0 0 0 / .25); }
.sheet.ok .sh-in { background: color-mix(in srgb, var(--ok-bg) 92%, var(--card)); border-color: var(--ok); }
.sheet.ko .sh-in { background: color-mix(in srgb, var(--ko-bg) 92%, var(--card)); border-color: var(--ko); }
.sh-head { display: flex; align-items: center; gap: 12px; }
.sh-ico { flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 700 1.5rem var(--display); animation: icoPop .55s var(--spring) .1s backwards; }
.ok .sh-ico { background: var(--ok); } .ko .sh-ico { background: var(--ko); }
@keyframes icoPop { from { transform: scale(0) rotate(-90deg); } }
.sh-head h2 { font-size: 1.5rem; flex: 1; }
.ok .sh-head h2 { color: var(--ok); } .ko .sh-head h2 { color: var(--ko); }
.pts { font: 700 1.2rem var(--display); color: var(--gold); animation: icoPop .5s var(--spring) .25s backwards; }
.sh-name { margin: 10px 0 2px; font-weight: 800; font-size: 1.05rem; }
.sh-meta { margin: 0 0 8px; font-size: .85rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sh-tip { margin: 0; font-size: .95rem; }
.sh-more { margin-top: 12px; display: grid; gap: 10px; animation: rise .35s var(--ease); }
.sh-more .dlist { margin: 0; }
.sh-more .conte { margin: 0; font-style: italic; color: var(--muted); font-size: .92rem; }
.credit { font-size: .72rem; color: var(--muted); margin: 0; }
.credit a { color: inherit; }
.sh-btns { display: grid; grid-template-columns: auto 1fr; gap: 10px; margin-top: 14px; }
.sh-btns .btn-soft { font-size: 1rem; padding: 12px 14px; }
.next { color: #fff; }
.ok .next { background: var(--ok); box-shadow: 0 5px 0 color-mix(in srgb, var(--ok) 55%, #000); }
.ko .next { background: var(--ko); box-shadow: 0 5px 0 color-mix(in srgb, var(--ko) 55%, #000); }
.next:active { box-shadow: none !important; }
body.sheet-open .wrap { padding-bottom: 280px; }
table.cmp { width: 100%; border-collapse: collapse; font-size: .85rem; background: var(--card); border-radius: 12px; overflow: hidden; }
.cmp th, .cmp td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.cmp th { background: var(--card-2); font-family: var(--display); font-weight: 600; }
.cmp td.hl, .cmp th.hl { background: color-mix(in srgb, var(--ok) 16%, var(--card)); }
.cmp td:first-child { font-weight: 800; color: var(--muted); }
.flash { position: fixed; inset: 0; z-index: 9; pointer-events: none; animation: flash .5s ease-out forwards; }
@keyframes flash { from { opacity: .35; } to { opacity: 0; } }
.toast { position: fixed; left: 50%; top: 70px; z-index: 30; translate: -50% 0; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; padding: 8px 18px; border-radius: 99px; font: 700 1.1rem var(--display); box-shadow: 0 8px 24px rgb(0 0 0 / .3); animation: toast 1.6s var(--spring) forwards; pointer-events: none; white-space: nowrap; }
@keyframes toast { 0% { opacity: 0; transform: scale(.4) translateY(-10px); } 15% { opacity: 1; transform: scale(1.08); } 25% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20px); } }

/* ---------- resultats ---------- */
.res { text-align: center; padding: 16px 0 4px; }
.stars { display: flex; justify-content: center; gap: 10px; margin: 6px 0 10px; }
.star { font-size: 3.2rem; line-height: 1; filter: grayscale(1) opacity(.25); }
.star.on { filter: none; animation: starIn .6s var(--spring) backwards; }
@keyframes starIn { 0% { transform: scale(0) rotate(-180deg); } 70% { transform: scale(1.3) rotate(10deg); } 100% { transform: none; } }
.res h1 { font-size: 2rem; }
.res .cfg { color: var(--muted); font-size: .85rem; margin: 4px 0 0; }
.big { display: inline-block; font: 700 3.6rem/1 var(--display); color: var(--gold); margin-top: 12px; }
.res .lbl { margin: 2px 0 0; color: var(--muted); font-weight: 700; }
.rec { display: inline-block; margin-top: 8px; background: linear-gradient(135deg, var(--gold), var(--accent)); color: #fff; border-radius: 99px; padding: 3px 14px; font: 700 .95rem var(--display); animation: icoPop .6s var(--spring) .8s backwards; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 16px 0; }
@media (max-width: 420px) { .stats { grid-template-columns: repeat(2, 1fr); } }
.stats div { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 6px; text-align: center; }
.stats b { display: block; font: 700 1.35rem var(--display); }
.stats span { font-size: .75rem; color: var(--muted); font-weight: 700; }
.misses { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.miss { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.miss img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.miss div { padding: 8px 10px; }
.miss h3 { font-size: .95rem; margin-bottom: 4px; }
.btns { display: grid; gap: 10px; margin-top: 18px; }
.zoom { position: fixed; inset: 0; background: rgb(0 0 0 / .92); z-index: 50; display: grid; place-items: center; padding: 8px; cursor: zoom-out; animation: fade .2s; }
.zoom img { max-width: 100%; max-height: 100%; object-fit: contain; animation: zoomIn .3s var(--ease); }

/* ---------- animacions ---------- */
@keyframes slideIn { from { opacity: 0; transform: translateX(40px); } }
@keyframes riseIn { from { opacity: 0; transform: translateY(18px) scale(.98); } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
@keyframes pop { from { transform: scale(0); } }
@keyframes popIn { 0% { transform: scale(.94); } 55% { transform: scale(1.05); } 100% { transform: scale(1); } }
@keyframes shake { 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
@keyframes bump { 40% { transform: scale(1.35); } }
@keyframes shimmer { to { background-position: -200% 0; } }
@keyframes fade { from { opacity: 0; } }
@keyframes zoomIn { from { opacity: 0; transform: scale(.9); } }
.anim-q { animation: slideIn .4s var(--ease) backwards; }
.anim-s { animation: riseIn .45s var(--ease) backwards; }
.anim .opts > *, .anim .grid > *, .anim .modes > *, .anim .stats > *, .anim .btns > *, .anim .misses > *, .anim .actions, .anim .panel, .anim .mastery {
  animation: rise .45s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 60ms + 100ms); }
.opt.right, .cell.right, .anim .opts > .opt.right, .anim .grid > .cell.right { animation: popIn .4s ease-out; animation-delay: 0s; }
.opt.wrong, .cell.wrong, .anim .opts > .opt.wrong, .anim .grid > .cell.wrong { animation: shake .45s; animation-delay: 0s; }
.spark { position: fixed; width: 9px; height: 9px; border-radius: 50%; pointer-events: none; z-index: 45; }
.spark.emo { width: auto; height: auto; background: none; font-size: 26px; line-height: 1; }
.float { position: fixed; font: 700 1.6rem var(--display); color: var(--gold); pointer-events: none; z-index: 45; text-shadow: 0 2px 8px rgb(0 0 0 / .35); }
.conf { position: fixed; pointer-events: none; z-index: 45; border-radius: 2px; font-size: 20px; line-height: 1; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; animation-delay: 0s !important; }
}

bosa sense volva. Anell doble que llisca.","carn":"Blanca, tendra al barret i fibrosa al peu. Olor de nou."},"habitat":"Clarianes, marges de camins, prats i boscos aclarits.","conte":"El gegant dels marges i les clarianes: un para-sol amb el peu de pell de serp. Només el culliràs si és ben gran.","truc":"Regla dels 15 cm: si el barret obert no fa almenys 15 cm, no el cullis.","conf":[{"id":"lepiota","t":"Lepiotes petites: menys de 8 cm, anell fràgil. MORTALS."},{"id":"rhacodes","t":"Paloma vermellosa: peu llis i carn que es torna vermella."}],"fotos":[{"src":"fotos/apagallums-1.jpg","t":"bo","cap":"En el seu punt: barret obert i gran, peu alt i prim.","autor":"victoriadurazo","llic":"CC BY-NC","url":"https://www.inaturalist.org/observations/249565615"},{"src":"fotos/apagallums-2.jpg","t":"jove","cap":"Jove i tancat (baqueta de timbal): espera que s'obri per comprovar la mida.","autor":"Ángel Argüelles","llic":"CC BY-NC","url":"https://www.inaturalist.org/observations/78686645"},{"src":"fotos/apagallums-3.jpg","t":"detall","cap":"Peu amb dibuix de pell de serp: la marca de l'apagallums.","autor":"Oriol Sastre","llic":"CC BY","url":"https://www.inaturalist.org/observations/251680029"},{"src":"fotos/apagallums-4.jpg","t":"detall","cap":"A sota: làmines blanques i anell gruixut que es mou.","autor":"Izan Lopez Vergel","llic":"CC BY-NC","url":"https://www.inaturalist.org/observations/318914718"},{"src":"fotos/apagallums-5.jpg","t":"detall","cap":"Compara la mida amb la moneda: com a mínim 15 cm.","autor":"José Ignacio Márquez Corro","llic":"CC BY-NC","url":"https://www.inaturalist.org/observations/4554589"},{"src":"fotos/apagallums-6.jpg","t":"habitat","cap":"Clarianes i marges de camins, sobre la fullaraca.","autor":"Joan Corominas Melian","llic":"CC BY-NC","url":"https://www.inaturalist.org/observations/322976900"},{"src":"fotos/apagallums-7.jpg","t":"vell","cap":"Vell: barret girat cap amunt, tou i fosc. Deixa'l.","autor":"mussolbarrios","llic":"CC BY-NC","url":"https oca","estat":"comestible","qual":"Molt bo","lvl":2,"forma":"lamines","on":["prat","fusta"],"desc":{"barret":"4–12 cm, marró grisenc (panical) o gris en forma d'ostra (soca), carnós, amb la vora enrotllada.","sota":"Làmines blanquinoses que baixen molt pel peu.","peu":"Curt, sovint descentrat o lateral, blanc.","carn":"Blanca, ferma i olorosa."},"habitat":"La de panical, en camps i ermots, sobre les arrels del panical. La de soca, sobre troncs de plàtans, pollancres o faigs.","conte":"La de panical neix als camps, enganxada a les arrels d'un card sec. La de soca, en pisos sobre els troncs.","truc":"La de panical neix de les arrels d'un panical; la de soca creix sobre fusta i mai és taronja.","conf":[{"id":"omphalotus","t":"Gírgola d'olivera: taronja intens, sobre oliveres. Tòxica."},{"id":"clitocybe","t":"Clitocibes de prat: blancs i no surten del panical."}],"fotos":[{"src":"fotos/girgola-1.jpg","t":"bo","cap":"Gírgola de panical en el seu punt: barret marró, carnós, i làmines que baixen pel peu.","autor":"toniconca","llic":"CC BY-NC","url":"https://www.inaturalist.org/observations/141067201"},{"src":"fotos/girgola-2.jpg","t":"jove","cap":"Jove, entre l'herba d'un camp.","autor":"Purnendu Roy","llic":"CC BY-NC","url":"https://www.inaturalist.org/observations/95537201"},{"src":"fotos/girgola-3.jpg","t":"detall","cap":"A sota: làmines blanquinoses que baixen molt pel peu.","autor":"Nico Hernandez","llic":"CC BY","url":"https://www.inaturalist.org/observations/54143764"},{"src":"fotos/girgola-4.jpg","t":"detall","cap":"Barret i làmines: el peu sovint surt descentrat.","autor":"Javier Royán Martín","llic":"CC BY-NC","url":"https://www.inaturalist.org/observations/341508287"},{"src":"fotos/girgola-5.jpg","t":"habitat","cap":"Gírgola de soca (orellana): en pisos sobre troncs tallats.","autor":"Claudia Fernández Bagan","llic":"CC BY-NC","url":"https://www.inaturalist.org/observations/142296862"},{"src":"fotos/girgola-6.jpg","t":"jove","cap":"Gírgoles de soca joves, sortint ":"https://www.inaturalist.org/observations/334230621"}]},{"id":"camadeperdiu","nom":"Cama de perdiu","es":"Pata de perdiz","lat":"Chroogomphus rutilus","guia":"chroogomphus-rutilus","aka":"","estat":"comestible","qual":"Bo","lvl":3,"forma":"lamines","on":["pineda"],"desc":{"barret":"4–10 cm, vermell coure o marró vinós, amb un mamelló punxegut; llefiscós quan és humit.","sota":"Làmines gruixudes i separades, ocre, que baixen molt pel peu i s'enfosqueixen fins a negre violaci.","peu":"Del color del barret, groguenc a la base, que s'aprima cap a baix.","carn":"Taronja salmó que es torna vinosa en coure-la."},"habitat":"Pinedes. Viu associada als pins i a les arrels dels mollerics.","conte":"A les pinedes de tardor, un bolet color de coure amb les làmines gruixudes. Quan el cuines, tenyeix el plat de color vi.","truc":"Làmines gruixudes que baixen pel peu + carn taronja + sota pins = cama de perdiu.","conf":[{"id":"orellanus","t":"Cortinari metzinós: làmines color rovell que no baixen pel peu, sota roures i castanyers. MORTAL."},{"id":"hygrophoropsis","t":"Rossinyol ataronjat: làmines fines i toves, carn prima."}],"fotos":[{"src":"fotos/camadeperdiu-1.jpg","t":"bo","cap":"Cama de perdiu en el seu punt: barret vermellós i làmines ocre que baixen pel peu.","autor":"Jorge Pérez Arienza","llic":"CC BY-NC","url":"https://www.inaturalist.org/observations/143650841"},{"src":"fotos/camadeperdiu-2.jpg","t":"detall","cap":"A sota: làmines gruixudes, separades, que baixen molt pel peu.","autor":"Assumpta MC","llic":"CC BY-NC","url":"https://www.inaturalist.org/observations/187672491"},{"src":"fotos/camadeperdiu-3.jpg","t":"detall","cap":"Carn i peu de color taronja salmó.","autor":"lkrauel","llic":"CC BY-NC","url":"https://www.inaturalist.org/observations/63647907"},{"src":"fotos/camadeperdiu-4.jpg","t":"habitat","cap":"Sempre sota pins, entre la pinassa.","autor":"Pablo Silvestre Pérez","llic":"CC BY-NC","url":"https://www.inaturalist.org/observations/250796610"},{"src":"fotos/ "petdellop","nom":"Pet de llop","es":"Pedo de lobo","lat":"Lycoperdon perlatum","alt":["bejín"],"guia":"lycoperdon-perlatum","aka":"","estat":"comestible","qual":"Acceptable (jove)","lvl":1,"forma":"altres","on":["pineda","fulla","prat"],"desc":{"barret":"Cos en forma de pera, 3–8 cm, blanc i cobert de berrugues petites com perles que es desprenen.","sota":"No té làmines ni porus: per dins és una massa blanca i compacta que es torna groga, verdosa i finalment pols marró.","peu":"Curt i ample, fa part del mateix cos.","carn":"Blanca i tova de jove; després esponjosa i en pols."},"habitat":"Tota mena de boscos, sovint entre la fullaraca i la molsa.","conte":"Una bola blanca coberta de perletes. Jove és bona; vella, quan la trepitges fa un núvol de pols.","truc":"Talla'l de dalt a baix: només és bo si per dins és blanc pur i uniforme. Si hi veus la silueta d'un bolet, és un ou d'amanita. Si és negre o violaci, és un escleroderma.","conf":[{"id":"escleroderma","t":"Escleroderma: pell gruixuda i dura, per dins negre violaci. Tòxic."},{"id":"phalloides","t":"Ou d'amanita: tallat, es veu el dibuix d'un bolet a dins. Pot ser MORTAL."}],"fotos":[{"src":"fotos/petdellop-1.jpg","t":"bo","cap":"Jove, blanc i ple de berrugues: és el moment de collir-lo.","autor":"guspiralsnuvols","llic":"CC BY-NC","url":"https://www.inaturalist.org/observations/166605730"},{"src":"fotos/petdellop-2.jpg","t":"jove","cap":"Grup de joves, blancs i ferms.","autor":"J. IGNASI","llic":"CC BY-NC","url":"https://www.inaturalist.org/observations/195605055"},{"src":"fotos/petdellop-3.jpg","t":"detall","cap":"Talla'l de dalt a baix: per dins ha de ser BLANC i compacte.","autor":"Cándido Sos","llic":"CC BY-NC","url":"https://www.inaturalist.org/observations/407303158"},{"src":"fotos/petdellop-4.jpg","t":"detall","cap":"Tallat: blanc i uniforme, sense cap silueta de bolet a dins.","autor":"José María Pando","llic":"CC BY-NC","url":"https://www.inaturalist.org/observations/325708110"},{"src":"fotos/petdellop- rno","nom":"Moixernó","es":"Perrechico","lat":"Calocybe gambosa","alt":["Seta de San Jorge","seta de San Jorge"],"guia":"calocybe-gambosa","aka":"També: bolet de Sant Jordi, moixernó de primavera","estat":"comestible","qual":"Excel·lent","lvl":2,"forma":"lamines","on":["prat"],"desc":{"barret":"3–10 cm, carnós, convex i després aplanat, blanc brut o crema, amb la vora enrotllada de jove.","sota":"Làmines molt atapeïdes i fines, blanques o crema.","peu":"Gruixut, curt, ple i blanc, sovint corbat.","carn":"Blanca, compacta, es desfà entre els dits. Olor i sabor de farina fresca."},"habitat":"Prats, clarianes d'herba i vores de bosc, sovint en rotllanes. Surt a la primavera, al voltant de Sant Jordi.","conte":"El bolet de Sant Jordi: a l'abril i al maig surt als prats en rotllanes, quan gairebé no hi ha cap altre bolet.","truc":"Surt a la primavera, en rotllanes, i fa olor de farina fresca.","conf":[{"id":"entoloma","t":"Fals carlet: olor de farina rància, làmines que es tornen rosades. Tòxic."},{"id":"inocybe","t":"Inocibe: làmines que es tornen vermelles en tocar-les. Tòxic."}],"fotos":[{"src":"fotos/quiz/moixerno-q1.jpg","t":"nou","autor":"sdok","llic":"CC BY NC","url":"https://www.inaturalist.org/observations/155331127"},{"src":"fotos/quiz/moixerno-q2.jpg","t":"nou","autor":"Martial Carette","llic":"CC BY NC","url":"https://www.inaturalist.org/observations/205230238"},{"src":"fotos/quiz/moixerno-q3.jpg","t":"nou","autor":"gabrielregnard","llic":"CC BY NC","url":"https://www.inaturalist.org/observations/346958515"},{"src":"fotos/quiz/moixerno-q4.jpg","t":"nou","autor":"Lucian Clanet","llic":"CC BY","url":"https://www.inaturalist.org/observations/271014956"},{"src":"fotos/quiz/moixerno-q5.jpg","t":"nou","autor":"Anne-Hélène Paradis","llic":"CC BY NC","url":"https://www.inaturalist.org/observations/204765883"},{"src":"fotos/quiz/moixerno-q6.jpg","t":"nou","autor":"TOMY TOUT","llic":"CC0","url":"https://www.inaturalist.org/observations/208522463"},{"src":"fotos/quiz/moixerno-q7.jpg","t":"nou","autor":"julesy121","llic":"CC BY NC","url":"https://www.inaturalist.org/observations/168678883"},{"src":"fotos/quiz/moixerno-q8.jpg","t":"nou","autor":"Xavier HURIEZ","llic":"CC BY NC","url":"https://www.inaturalist.org/observations/215712683"},{"src":"fotos/quiz/moixerno-q9.jpg","t":"nou","autor":"Nicolas HELITAS","llic":"CC BY NC","url":"https://www.inaturalist.org/observations/349588254"},{"src":"fotos/quiz/moixerno-q10.jpg","t":"nou","autor":"Calvin Siméon","llic":"CC BY NC","url":"https://www.inaturalist.org/observations/280540150"},{"src":"fotos/quiz/moixerno-q11.jpg","t":"nou","autor":"Philippe Geniez","llic":"CC BY NC","url":"https://www.inaturalist.org/observations/139450492"},{"src":"fotos/quiz/moixerno-q12.jpg","t":"nou","autor":"gerardbertrand","llic":"CC BY","url":"https://www.inaturalist.org/observations/153830209"}]},{"id":"murgola","nom":"Múrgola","es":"Colmenilla","lat":"Morchella esculenta · M. conica","alt":["cagarria"],"guia":"morchella-esculenta","aka":"També: murga, rabassola","estat":"comestible","qual":"Excel·lent (sempre ben cuita)","lvl":2,"forma":"altres","on":["fulla","prat"],"desc":{"barret":"4–10 cm, ovoide o allargat, ple d'alvèols profunds com un rusc, de groc palla a bru ocraci.","sota":"Tot el barret és un panal d'alvèols; no té làmines ni porus.","peu":"3–6 cm, blanc o crema, buit i fràgil, unit al barret.","carn":"Prima, cerosa i fràgil, blanquinosa. Olor suau de bolet."},"habitat":"Vores de bosc, ribes, hortes i terres remogudes, sovint sota arbres de fulla ampla. De març a maig.","conte":"El bolet de la primavera, amb el barret com un rusc d'abelles. És boníssima, però només si es cou bé: en crua és tòxica.","truc":"Talla-la per la meitat: ha de ser buida, d'una sola peça. I mai la mengis crua.","conf":[{"id":"capadella","t":"Capadella: barret arrugat com un cervell i amb cambres per dins. Tòxica, pot ser mortal."}],"fotos":[{"src":"fotos/quiz/murgola-q1.jpg","t":"nou","autor":"Frank Whitlock","llic":"C ines ni porus: la superfície és plena de plecs i circumvolucions.","peu":"Blanc o rosat, curt, buit i fràgil, solcat.","carn":"Blanca i fràgil, sense olor destacable."},"habitat":"Sota pins, a prop de soques velles i en forats d'arbres arrencats. Més freqüent al Pirineu i al Prepirineu, a la primavera.","conte":"Es pareix a una múrgola, però és un dels bolets més perillosos de la primavera: tòxic i potencialment mortal, també cuit.","truc":"Barret com un cervell arrugat i cambres per dins: ni cuita és segura.","conf":[{"id":"murgola","t":"Múrgola: barret de panal d'alvèols i un sol buit continu per dins."}],"fotos":[{"src":"fotos/quiz/capadella-q1.jpg","t":"nou","autor":"colineminhy","llic":"CC BY NC","url":"https://www.inaturalist.org/observations/164390510"},{"src":"fotos/quiz/capadella-q2.jpg","t":"nou","autor":"Claudia Pogoreutz","llic":"CC BY NC","url":"https://www.inaturalist.org/observations/220038129"},{"src":"fotos/quiz/capadella-q3.jpg","t":"nou","autor":"Yannick Brenz","llic":"CC BY","url":"https://www.inaturalist.org/observations/80465281"},{"src":"fotos/quiz/capadella-q4.jpg","t":"nou","autor":"vegancake","llic":"CC BY NC","url":"https://www.inaturalist.org/observations/326172276"},{"src":"fotos/quiz/capadella-q5.jpg","t":"nou","autor":"Christophe Buidin","llic":"CC BY NC","url":"https://www.inaturalist.org/observations/141547854"},{"src":"fotos/quiz/capadella-q6.jpg","t":"nou","autor":"Benoît Segerer","llic":"CC BY NC","url":"https://www.inaturalist.org/observations/108954820"},{"src":"fotos/quiz/capadella-q7.jpg","t":"nou","autor":"Ties Kemme","llic":"CC BY NC","url":"https://www.inaturalist.org/observations/232241503"},{"src":"fotos/quiz/capadella-q8.jpg","t":"nou","autor":"Virginie de la Porte des Vaux","llic":"CC BY NC","url":"https://www.inaturalist.org/observations/284225990"},{"src":"fotos/quiz/capadella-q9.jpg","t":"nou","autor":"Olmes W","llic":"CC BY","url":"https://www.inaturalist.org/observations/344184761"},{"src":"fotos/quiz/capadella-q10.jpg","t":"nou","autor":"albertgabriel","llic":"CC BY NC","url":"https://www.inaturalist.org/observations/111560382"},{"src":"fotos/quiz/capadella-q11.jpg","t":"nou","autor":"paulesch","llic":"CC BY NC","url":"https://www.inaturalist.org/observations/204747684"},{"src":"fotos/quiz/capadella-q12.jpg","t":"nou","autor":"ncamberoque","llic":"CC BY NC","url":"https://www.inaturalist.org/observations/162438823"}]},{"id":"armillaria","nom":"Cama-sec de soca","es":"Armilaria","lat":"Armillaria mellea","alt":["Armilaria color de miel","seta de miel"],"guia":"armillaria-mellea","aka":"També: alzinoi, pollancró, flota d'alzina","estat":"comestible","qual":"Mitjà (només jove i ben cuit)","lvl":4,"forma":"lamines","on":["fusta"],"desc":{"barret":"5–15 cm, color mel, de globós a pla, amb un mamelló més fosc i escates petites al centre.","sota":"Làmines poc atapeïdes, blanques o groc pàl·lid, que s'enrogeixen amb l'edat; una mica decurrents.","peu":"Llarg, fibrós i robust, color mel, sovint més gruixut a la base, amb un anell membranós groc pàl·lid.","carn":"Blanca, fibrosa al peu, de sabor astringent."},"habitat":"En grans ramells al peu d'arbres vius o sobre soques i arrels (alzines, pollancres, pins i molts altres).","conte":"Un paràsit voraç dels arbres que forma ramells enormes. Cal cuinar-lo bé i provar-ne només una mica la primera vegada.","truc":"Esporada blanca i anell gruixut. La galerina mortal té l'esporada marró rovell.","conf":[{"id":"galerina","t":"Galerina marginada: més petita, anell fràgil i esporada marró rovell. Mortal."},{"id":"hypholoma","t":"Flota de pi groga: groc sofre, làmines verdoses i molt amarga. Tòxica."}],"fotos":[{"src":"fotos/quiz/armillaria-q1.jpg","t":"nou","autor":"natomik","llic":"CC BY","url":"https://www.inaturalist.org/observations/73316781"},{"src":"fotos/quiz/armillaria-q2.jpg","t":"nou","autor":"francis godwell","llic":"CC BY NC","url":"https://www.inaturalist.org/observations/188890715"},{"src":"fotos/quiz/armillaria-q3.jpg","t":"nou", <script>
"use strict";
const SP = DATA.sp, COMPARA = DATA.compara;
const BY = Object.fromEntries(SP.map(s => [s.id, s]));
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [r[i], r[j]] = [r[j], r[i]]; } return r; };
const pick = a => a[Math.random() * a.length | 0];
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

const ESTAT = { comestible: "Comestible", precaucio: "Precaució", toxic: "Tòxic", mortal: "Mortal" };
const FORMA = { lamines: "Làmines", porus: "Porus", plecs: "Plecs o llis", agullons: "Agullons", altres: "Altres (bola, corall, panal…)" };
const HAB = { pineda: "Pineda", fulla: "Bosc de fulla", prat: "Prat", fusta: "Sobre fusta" };
const LVL = { 1: "Els clàssics", 2: "Aficionat", 3: "Expert", 4: "Mestre" };
const MODE = { mix: ["🎲", "Tot barrejat", "De tot una mica"], id: ["📸", "Quin bolet és?", "Foto → nom"], look: ["🔍", "Paregudes", "No els confonguis"], cls: ["🏷️", "Per tipus", "Comestible? Làmines?"] };
// Tipus de foto que surten a cada nivell (de la guia: al seu punt, jove, detall…; «nou» = fotos d'iNaturalist)
const TYPES = {
  1: ["bo", "color", "nou"],
  2: ["bo", "color", "nou", "jove", "habitat"],
  3: ["bo", "color", "nou", "jove", "habitat", "vell", "detall"],
  4: ["bo", "color", "nou", "jove", "habitat", "vell", "detall", "podrit"],
};
const TYPE_TXT = { bo: "Al seu punt", color: "Color", nou: "", jove: "Jove", habitat: "Hàbitat", vell: "Vell", detall: "Detall", podrit: "Passat" };

/* ---------- memòria (localStorage amb protecció) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { } },
};
const SAVE = store.get("quiz-bolets-v1", { best: {}, sp: {} });
const persist = () => store.set("quiz-bolets-v1", SAVE);
const mastered = () => SP.filter(s => { const t = SAVE.sp[s.id]; return t && t.ok >= 2 && t.ok >= 2 * t.ko; }).length;

/* ---------- noms (català / castellà) i respostes escrites ---------- */
const nrm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
const key = s => nrm(s).replace(/^(el|la|els|les|l|un|una) /, "").replace(/ /g, "");
const nm = sp => esc(sp.nom) + (sp.es && nrm(sp.es) !== nrm(sp.nom) ? `<span class="es"> / ${esc(sp.es)}</span>` : "");
const genusCount = {};
SP.forEach(s => new Set(s.lat.split(/ · | i /).map(x => x.split(" ")[0]).filter(g => /^[A-Z][a-z]+$/.test(g))).forEach(g => genusCount[g] = (genusCount[g] || 0) + 1));
const primary = new Set(SP.map(s => key(s.nom)));
SP.forEach(s => {
  const raw = [s.nom, s.es, ...s.nom.split(/ i | · /), ...(s.aka || "").replace(/^També:\s*/, "").split(/,| o /), ...s.lat.split(/ · | i /), s.ant, ...(s.alt || [])];

  if (m === "look") opts = `<div class="set"><p>Parelles</p>${seg("d", [[1, "Fàcils"], [2, "Mitjanes"], [3, "Difícils"], [0, "Totes"]], cfg.d)}</div>
    <div class="set"><p>Pregunta</p>${seg("type", [["name", "Quin és?"], ["find", "Troba'l"], ["mix", "Barreja"]], cfg.type)}</div>`;
  if (m === "cls") opts = `<div class="set"><p>Què endevines?</p>${seg("attr", [["estat", "Perill"], ["forma", "Forma"], ["hab", "Hàbitat"], ["odd", "Troba'l"]], cfg.attr)}
    <small>${{ estat: "Comestible, tòxic o mortal?", forma: "Làmines, porus, plecs…?", hab: "Pineda, prat, fusta…?", odd: "4 fotos: quin és el comestible / tòxic / mortal?" }[cfg.attr]}</small></div>` + lvlSet();
  const best = SAVE.best[bestKey()];
  const card = (k, n) => `<button class="mode" data-mode="${k}" aria-pressed="${m === k}"><span class="ico">${MODE[k][0]}</span><b>${MODE[k][1]}</b><span>${MODE[k][2]}</span><em>${fmt(n)} preguntes</em></button>`;
  show("home", `
    <header class="top"><svg class="shroom" viewBox="0 0 64 64" aria-hidden="true"><path d="M6 36C6 18 19 7 32 7s26 11 26 29z" fill="#e0402f"/><circle cx="21" cy="25" r="4.5" fill="#fff"/><circle cx="38" cy="17" r="3.5" fill="#fff"/><circle cx="45" cy="30" r="4" fill="#fff"/><path d="M23 36h18v14c0 7-3.5 11-9 11s-9-4-9-11z" fill="#f2e6cf"/></svg>
      <h1>Quiz de bolets</h1>${sndBtn()}</header>
    <div class="pills"><span class="pill">🍄 <b>${SP.length}</b> bolets</span><span class="pill">📷 <b>${fmt(DATA.nfotos)}</b> fotos</span><span class="pill">❓ <b>${fmt(COUNTS.total)}</b> preguntes</span></div>
    <div class="mastery"><div class="row">Bolets dominats <span>${dom} / ${SP.length}</span></div><div class="mbar"><i style="width:${Math.max(dom / SP.length * 100, 2)}%"></i></div></div>
    <p class="warn">⚠️ Només és un joc: no mengis mai un bolet per una foto.</p>

    <div class="modes" role="group" aria-label="Mode de joc">${card("mix", COUNTS.total)}${card("id", COUNTS.id)}${card("look", COUNTS.look)}${card("cls", COUNTS.cls)}</div>
    <div class="panel">
      <div class="set"><p>Dificultat</p>${seg("diff", [["normal", "🌱 Normal", "pistes a la vista"], ["dificil", "🔥 Difícil", "sense pistes · ×2"]], cfg.diff)}</div>
      ${opts}
      <div class="set"><p>Preguntes</p>${seg("n", [[5, "5"], [10, "10"], [20, "20"], [50, "50"], [0, "∞"]], cfg.n)}</div>
    </div>
    <button class="btn3d btn-go play" data-act="start">Juga!${best ? `<small>🏆 Rècord: ${best}</small>` : ""}</button>
    <a class="guia-card" href="../guia/"><span class="ico">📗</span><span><b>Guia «Setas de Cataluña»</b><small>163 fitxes, quadern de camp per imprimir, arbres i llibres en PDF</small></span><span aria-hidden="true">›</span></a>
    <a class="guia-card" href="../"><span class="ico">🧺</span><span><b>Cistella Segura</b><small>Fitxes en català, mapa de zones, avui al bosc i quadern de butxaca</small></span><span aria-hidden="true">›</span></a>
    <p class="foot">Fotos d'iNaturalist (Creative Commons). L'autor surt a la fitxa de cada foto.</p>`);
}

/* ---------- partida ---------- */
function start(qs, endless) {
  Q = { qs, i: 0, score: 0, streak: 0, best: 0, ok: 0, tot: 0, wrong: [], endless: !!endless, hard: cfg.diff === "dificil" };
  question();
}
function begin(quick) {
  store.set("quiz-bolets-cfg", cfg);
  usedPhotos.clear();
  const qs = gen({ ...cfg, n: cfg.n || 20 }), endless = !cfg.n;
  intro(`${MODE[cfg.mode][0]} ${MODE[cfg.mode][1]}`, cfgText(), quick, () => start(qs, endless));
}

function descRows(sp, full) {
  const src = full && sp.full ? sp.full : sp, d = src.desc || {};
  return [["Barret", d.barret], ["Sota", d.sota], ["Peu", d.peu], ["Carn", d.carn], ["Hàbitat", src.habitat]].filter(r => r[1]).map(([k, v]) => [k, esc(v)]);
}
const dlist = rows => `<dl class="dlist">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;
const photoHTML = q => `<figure class="photo"><img src="${esc(q.photo.src)}" alt="Foto d'un bolet per identificar" data-zoom>${TYPE_TXT[q.photo.t] ? `<span class="tag">${TYPE_TXT[q.photo.t]}</span>` : ""}<span class="zoomhint" aria-hidden="true">⤢</span></figure>`;

// Pistes en pestanyes. Normal: obertes. Difícil: tancades amb cadenat; obrir-ne una resta 4 punts.
function hintItems(q) {
  if (q.kind === "name" && !q.group) return q.clue === "desc" ? [{ k: "foto", label: "📷 Foto", photo: 1 }] : descRows(q.sp).map(([k, v]) => ({ k, label: k, html: v }));
  if (q.group) return [{ k: "clau", label: "🔑 Clau", html: esc(q.group.clau) }];
  if (q.kind === "cls") return [{ k: "nom", label: "🍄 Quin és?", html: `És ${nm(q.sp)}.` }];
  if (q.odd) return [{ k: "noms", label: "🏷️ Noms", labels: 1 }];
  return [];
}
const isOpen = (q, k) => !Q.hard || q.open.has(k);
function renderHints(q) {
  const slot = $(".hint-slot"); if (!slot) return;
  const items = hintItems(q); if (!items.length) return;
  if (items.some(i => i.labels && isOpen(q, i.k))) $$(".cell").forEach(c => { if (!$(".lab", c)) c.insertAdjacentHTML("beforeend", `<span class="lab">${nm(BY[c.dataset.pick])}</span>`); });
  if (!Q.hard && items.length === 1) {  // una sola pista oberta: directament la capsa
    const i = items[0]; slot.innerHTML = i.html ? `<div class="hbox"><b>${i.label}</b> ${i.html}</div>` : ""; return;
  }
  const act = items.find(i => i.k === q.active && isOpen(q, i.k));
  slot.innerHTML = `<div class="htabs" role="tablist" aria-label="Pistes">${items.map(i => {
      const open = isOpen(q, i.k);
      return `<button class="htab${act === i ? " on" : ""}${open ? "" : " lock"}" data-hint="${i.k}" role="tab" aria-selected="${act === i}">${open ? "" : "🔒 "}${i.label}${open ? "" : " <small>−4</small>"}</button>`;
    }).join("")}</div>${act && act.html ? `<div class="hbox">${act.html}</div>` : ""}${act && act.photo ? `<div class="hbox photo-h">${photoHTML(q)}</div>` : ""}`;
  watchImgs(slot);
}
function openHint(k) {
  const q = Q && Q.qs[Q.i]; if (!q || q.answered) return;
  if (!isOpen(q, k)) { q.open.add(k); q.hints++; sfx.hint(); buzz(8); } else sfx.tap();
  q.active = k; renderHints(q);
}
const scoreHTML = () => `<span class="score-p">⭐ <span class="sv">${Q.score}</span></span>${Q.streak >= 2 ? `<span class="streak-p">🔥${Q.streak}</span>` : ""}`;

function question() {
  const q = Q.qs[Q.i]; q.answered = false; q.hints = 0; q.open = new Set();
  q.active = Q.hard ? null : (q.kind === "name" && !q.group && q.clue !== "desc" ? "Sota" : null);
  const hud = `<div class="hud"><button class="ibtn" data-act="quit" aria-label="Acaba la partida">✕</button>
    ${Q.endless ? `<span class="cnt">#${Q.i + 1}</span><div style="flex:1"></div>` : `<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${Q.qs.length}" aria-valuenow="${Q.i}"><i style="width:${Q.i / Q.qs.length * 100}%"></i></div><span class="cnt">${Q.i + 1}/${Q.qs.length}</span>`}
    <span class="sc">${scoreHTML()}</span>${sndBtn()}${Q.endless ? `<button class="fin" data-act="quit">Acaba</button>` : ""}</div>`;
  let body = `${q.tag ? `<span class="qtag${q.clue === "desc" ? " hard" : ""}">${esc(q.tag)}</span>` : ""}<h2 class="prompt">${q.prompt}</h2>`;
  if (q.photo && q.clue !== "desc") body += photoHTML(q);
  if (q.clue === "desc") body += dlist(descRows(q.sp));
  body += `<div class="hint-slot"></div>`;
  if (q.kind === "find") {
    body += `<div class="grid">${q.cells.map((c, i) => `<button class="cell" data-pick="${c.id}" aria-label="Foto ${i + 1}"><img src="${esc(c.photo.src)}" alt="Foto ${i + 1}"></button>`).join("")}</div>`;
  } else if (q.typed) {
    body += `<form class="type" autocomplete="off"><input name="a" aria-label="Nom del bolet" placeholder="Escriu el nom…" autocapitalize="off" spellcheck="false" enterkeyhint="send"><button class="btn3d btn-go">OK</button></form>`;
  } else {
    const label = o => q.kind === "cls" ? esc(o.label) : nm(BY[o.id]);
    body += `<div class="opts${q.opts.length === 4 || q.opts.length === 2 ? " two" : ""}">${q.opts.map((o, i) => `<button class="opt" data-pick="${esc(o.id)}"><span class="k">${"ABCDE"[i]}</span>${label(o)}</button>`).join("")}</div>`;
  }
  body += `<div class="actions"><button class="btn3d btn-soft" data-act="skip">🤷 No ho sé</button></div>`;
  show("q" + Q.i, hud + body);
  renderHints(q);
  const nx = Q.qs[Q.i + 1]; if (nx) (nx.photo ? [nx.photo] : (nx.cells || []).map(c => c.photo)).forEach(p => { new Image().src = p.src; });
  const inp = $(".type input"); if (inp && matchMedia("(hover:hover)").matches) inp.focus();
  window.scrollTo(0, 0);
}

function cmpTable(g, hlId) {
  return `<table class="cmp"><thead><tr><th></th>${g.cols.map(id => `<th class="${id === hlId ? "hl" : ""}">${nm(BY[id])}</th>`).join("")}</tr></thead>
    <tbody>${g.rows.map(r => `<tr>${r.map((c, i) => `<td class="${i && g.cols[i - 1] === hlId ? "hl" : ""}">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
const badge = sp => `<span class="badge b-${sp.estat}">${ESTAT[sp.estat]}</span>`;
const guiaLink = sp => sp.guia ? `<p class="guia-link"><a href="../guia/#/especie/${esc(sp.guia)}" target="_blank" rel="noopener">📗 Fitxa completa a la guia <small>(en castellà: confusions, hàbitat, calendari, fonts)</small></a></p>` : "";
const credit = f => f ? `<p class="credit">📷 ${esc(f.autor)} · ${esc(f.llic)} · <a href="${esc(f.url)}" target="_blank" rel="noopener">iNaturalist</a></p>` : "";
function points(q) {
  let p = Q.hard ? Math.max(4, 20 - 4 * (q.hints || 0)) : 10;
  if (q.typed) p *= 2;
  return p + Math.min(Q.streak - 1, 5);
}
const RIGHT_T = ["Correcte!", "Molt bé!", "Exacte!", "Boníssim!", "Perfecte!"], WRONG_T = ["Ups!", "Vaja!", "Gairebé…", "No era aquest"];

function answer(chosen, typedText) {
  const q = Q.qs[Q.i]; if (q.answered) return; q.answered = true;
  const sp = q.sp; let right = false, said = null, note = "";
  if (chosen === "__skip") right = false;
  else if (q.typed) {
    said = matchSpecies(typedText, sp); right = said === sp;
    if (!right) note = said ? `Has escrit ${nm(said)}, que és un altre bolet.` : `No he reconegut «${esc(typedText)}».`;
  }
  else if (q.kind === "cls") right = CLS[q.attr].ok(sp, chosen);
  else { right = chosen === sp.id; if (q.kind === "name") said = BY[chosen]; }

  // marcar les opcions
  $$("[data-pick]").forEach(b => {
    b.disabled = true; const id = b.dataset.pick;
    const isRight = q.kind === "cls" ? CLS[q.attr].ok(sp, id) : id === sp.id;
    b.classList.add(isRight ? "right" : id === chosen ? "wrong" : "dim");
    const k = $(".k", b); if (k && (isRight || id === chosen)) k.textContent = isRight ? "✓" : "✗";
    if (q.kind === "find") { $(".lab", b)?.remove(); b.insertAdjacentHTML("beforeend", `<span class="lab">${nm(BY[id])}${q.odd ? " · " + ESTAT[BY[id].estat] : ""}</span>`); }
  });
  $$(".htab").forEach(b => b.disabled = true);
  const f = $(".type"); if (f) $$("input, button", f).forEach(x => x.disabled = true);
  $(".actions").hidden = true; Q.tot++;

  // punts, ratxa i efectes
  const before = Q.score; let pts = 0;
  if (right) { Q.streak++; Q.best = Math.max(Q.best, Q.streak); pts = points(q); Q.score += pts; Q.ok++; }
  else { Q.streak = 0; Q.wrong.push(q); }
  $(".hud .sc").innerHTML = scoreHTML(); countUp($(".hud .sv"), before, Q.score, 600); restart($(".hud .score-p"), "bump");
  const bar = $(".bar i"); if (bar) bar.style.width = (Q.i + 1) / Q.qs.length * 100 + "%";
  if (right) {
    sfx.right(Q.streak); buzz(15); flash(true); burst($(".right") || f || $(".hud .score-p"), `+${pts}`);
    if (Q.streak === 3 || Q.streak === 5 || Q.streak % 10 === 0) { toast(`🔥 Ratxa de ${Q.streak}!`); sfx.streak(Q.streak); }
  } else {
    chosen === "__skip" ? sfx.skip() : sfx.wrong(); buzz([30, 40, 30]); if (chosen !== "__skip") flash(false);
    restart($(".photo"), "shake"); if (f) restart(f, "shake");
  }
  const st = SAVE.sp[sp.id] || (SAVE.sp[sp.id] = { ok: 0, ko: 0 }); st[right ? "ok" : "ko"]++; persist();

  // què ha passat (curt) + fitxa plegada
  const title = right ? pick(RIGHT_T) : chosen === "__skip" ? "Cap problema" : pick(WRONG_T);
  let line;
  if (q.kind === "cls") line = `${nm(sp)}: <b>${esc({ estat: ESTAT[sp.estat], forma: FORMA[sp.forma], hab: sp.on.map(x => HAB[x]).join(" o ") }[q.attr])}</b>`;
  else if (q.odd) line = `${nm(sp)} és <b>${ESTAT[sp.estat].toLowerCase()}</b>`;
  else line = right ? nm(sp) : `Era: ${nm(sp)}`;
  let tip;
  if (note) tip = note;
  else if (!right && said && said !== sp) { const c = (sp.conf || []).find(c => c.id === said.id); tip = c ? `Has triat ${nm(said)}: ${esc(c.t)}` : `Has triat ${nm(said)}.`; }
  else if (q.group) tip = `🔑 ${esc(q.group.clau)}`;
  else tip = sp.truc ? `💡 ${esc(sp.truc)}` : "";
  const more = `${q.photo && q.photo.cap ? `<p class="conte">📷 ${esc(q.photo.cap)}</p>` : ""}${q.group ? cmpTable(q.group, sp.id) : ""}
    ${q.kind !== "find" || q.odd ? dlist(descRows(sp, true)) : ""}${sp.conte ? `<p class="conte">${esc(sp.conte)}</p>` : ""}${guiaLink(sp)}${credit(q.photo)}`;
  const last = !Q.endless && Q.i + 1 >= Q.qs.length;
  const sheet = document.createElement("section");
  sheet.className = `sheet ${right ? "ok" : "ko"}`; sheet.setAttribute("role", "status");
  sheet.innerHTML = `<div class="sh-in"><div class="sh-head"><span class="sh-ico">${right ? "✓" : "✗"}</span><h2>${title}</h2>${right ? `<span class="pts">+${pts}</span>` : ""}</div>
    <p class="sh-name">${line}</p><p class="sh-meta">${badge(sp)}<i>${esc(sp.lat)}</i>${sp.ant ? ` <small>(abans <i>${esc(sp.ant)}</i>)</small>` : ""}</p>${tip ? `<p class="sh-tip">${tip}</p>` : ""}
    <div class="sh-more" hidden>${more}</div>
    <div class="sh-btns"><button class="btn3d btn-soft" data-act="more" aria-expanded="false">📖 Fitxa</button><button class="btn3d next" data-act="next">${last ? "Resultat" : "Continua"}</button></div></div>`;
  app.append(sheet); document.body.classList.add("sheet-open");
  $(".next", sheet).focus({ preventScroll: true });
}

function results() {
  const n = Q.tot, pct = Math.round(Q.ok / n * 100), k = bestKey(), prev = SAVE.best[k] || 0;
  const record = Q.score > prev && prev > 0; if (Q.score > prev) { SAVE.best[k] = Q.score; persist(); }
  const stars = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 40 ? 1 : 0;
  const title = ["A repassar!", "Bon intent!", "Molt bé!", "Boletaire de debò!"][stars];
  const seen = new Set(), miss = Q.wrong.filter(q => !seen.has(q.sp.id) && seen.add(q.sp.id));
  show("results", `<div class="res"><div class="stars">${[0, 1, 2].map(i => `<span class="star${i < stars ? " on" : ""}" style="animation-delay:${.35 + i * .35}s">⭐</span>`).join("")}</div>
      <h1>${title}</h1><p class="cfg">${MODE[cfg.mode][0]} ${MODE[cfg.mode][1]} · ${esc(cfgText())}</p>
      <div class="big">${REDUCED ? Q.score : 0}</div><p class="lbl">punts</p>${record ? `<span class="rec">🏆 Nou rècord!</span>` : ""}</div>
    <div class="stats"><div><b>${Q.ok}/${n}</b><span>encerts</span></div><div><b>${pct}%</b><span>precisió</span></div><div><b>🔥${Q.best}</b><span>millor ratxa</span></div><div><b>${mastered()}</b><span>dominats</span></div></div>
    ${miss.length ? `<h2 class="h-sec">Per repassar</h2><div class="misses">${miss.map(q => { const sp = q.sp, ph = q.photo || q.cells.find(c => c.id === sp.id).photo;
      return `<div class="miss"><img src="${esc(ph.src)}" alt="${esc(sp.nom)}" loading="lazy"><div><h3>${nm(sp)}</h3>${badge(sp)}</div></div>`; }).join("")}</div>` : ""}
    <div class="btns">${Q.wrong.length ? `<button class="btn3d btn-go" data-act="retry">🔁 Repassa els errors (${Q.wrong.length})</button>` : ""}
      <button class="btn3d btn-soft" data-act="again">Torna-hi</button><button class="btn3d btn-soft" data-act="home">Inici</button></div>`);
  window.scrollTo(0, 0);
  countUp($(".big"), 0, Q.score, 1000);
  for (let i = 0; i < stars; i++) setTimeout(() => sfx.star(i), 350 + i * 350);
  setTimeout(() => sfx.fanfare(pct, record), 350 + stars * 350);
  if (stars >= 2) setTimeout(confetti, 300 + stars * 350);
}

/* ---------- events ---------- */
document.addEventListener("pointerdown", e => { lastPt = [e.clientX, e.clientY]; }, true);
document.addEventListener("click", e => {
  const t = e.target.closest("button, img[data-zoom]"); if (!t || t.disabled) return;
  if (t.dataset.zoom !== undefined) { sfx.tap(); const z = document.createElement("div"); z.className = "zoom"; z.innerHTML = `<img src="${esc(t.src)}" alt="">`; z.onclick = () => z.remove(); document.body.append(z); return; }
  if (t.dataset.mode) { cfg.mode = t.dataset.mode; sfx.pop(); store.set("quiz-bolets-cfg", cfg); home(); return pulse($(`[data-mode="${cfg.mode}"]`)); }
  if (t.dataset.cfg) { const k = t.dataset.cfg, v = t.dataset.v; cfg[k] = /^\d+$/.test(v) ? +v : v; sfx.pop(); store.set("quiz-bolets-cfg", cfg); home(); return pulse($(`[data-cfg="${k}"][data-v="${v}"]`)); }
  if (t.dataset.pick !== undefined) return answer(t.dataset.pick);
  if (t.dataset.hint) return openHint(t.dataset.hint);
  const a = t.dataset.act; if (!a) return;
  if (a === "snd") return toggleSound();
  if (a === "start") return begin(false);
  if (a === "again") return begin(true);
  if (a === "home") { sfx.tap(); return home(); }
  if (a === "skip") return answer("__skip");
  if (a === "more") { const m = $(".sh-more"), open = m.hidden; m.hidden = !open; t.setAttribute("aria-expanded", open); t.textContent = open ? "Amaga" : "📖 Fitxa"; sfx.tap(); return; }
  if (a === "quit") return Q && Q.tot ? results() : home();
  if (a === "next") { sfx.swipe(); Q.i++; if (Q.endless && Q.i >= Q.qs.length - 2) Q.qs.push(...gen({ ...cfg, n: 20 })); return Q.i < Q.qs.length ? question() : results(); }
  if (a === "retry") {
    const qs = shuffle(Q.wrong).map(q => Object.assign({}, q, { opts: q.opts && shuffle(q.opts), cells: q.cells && shuffle(q.cells) }));
    return intro("🔁 Repàs", `${qs.length} per tornar a provar`, true, () => start(qs));
  }
});
document.addEventListener("submit", e => {
  if (!e.target.matches(".type")) return; e.preventDefault();
  const v = e.target.a.value.trim(); if (v) answer("__typed", v);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { const z = $(".zoom"); if (z) return z.remove(); if (skipIntro) return skipIntro(); }
  if (e.target.matches("input") || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "m") return toggleSound();
  const q = Q && Q.qs[Q.i]; if (!q || $(".intro")) return;
  if (q.answered) { if (e.key === "Enter") { e.preventDefault(); $(".next")?.click(); } if (e.key === "f") $("[data-act=more]")?.click(); return; }
  const n = +e.key; if (n >= 1 && n <= 9) $$("[data-pick]")[n - 1]?.click();
});

/* ---------- arrencada: pantalla de càrrega que precarrega fotos ---------- */
(function boot() {
  const sp = $("#splash"); if (!sp) return home();
  const bar = $(".sp-bar i", sp), tip = $(".sp-tip", sp);
  const MIN = REDUCED ? 400 : 3200, MAX = 8000, t0 = performance.now();
  const tips = ["Entrant al bosc…", "Recollint rovellons…", "Comptant espores…", "Mirant sota el barret…", "Ensumant olor de farina…", "Preparant la cistella…"];
  let ti = 0, loaded = 0, skip = false;
  const tipT = setInterval(() => { tip.textContent = tips[++ti % tips.length]; tip.classList.remove("sw"); void tip.offsetWidth; tip.classList.add("sw"); }, 700);
  const imgs = shuffle(SP).slice(0, 12).map(s => s.fotos[0].src), total = imgs.length + 1;
  imgs.forEach(src => { const im = new Image(); im.onload = im.onerror = () => loaded++; im.src = src; });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => loaded++, () => loaded++);
  sp.addEventListener("click", () => { if (performance.now() - t0 > 500) { skip = true; sfx.pop(); } });
  (function step() {
    const el = performance.now() - t0, p = skip ? 1 : Math.min(loaded / total, el / MIN);
    bar.style.width = Math.max(p, el / MAX) * 100 + "%";
    if (p >= 1 || el > MAX) {
      clearInterval(tipT); tip.textContent = "Som-hi!"; bar.style.width = "100%";
      setTimeout(() => { home(); sp.classList.add("out"); setTimeout(() => sp.remove(), 750); }, skip ? 0 : 300);
    } else setTimeout(step, 40);
  })();
})();
</script>
